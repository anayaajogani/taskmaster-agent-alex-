[project]
name = "taskmaster-agent"
version = "0.1.0"
description = "An ambient agent that processes student assignments via Pub/Sub triggers, estimating effort with Gemini and scheduling Google Calendar work blocks using ADK 2.0 graph-based workflows."
authors = [
    {name = "Elia Secchi", email = "eliasecchi@google.com"},
]
license = {text = "Apache License 2.0"}
requires-python = ">=3.11,<3.13"

dependencies = [
    "google-adk>=2.0.0a0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.34.0",
    "requests>=2.32.0",
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.4.6",
    "mypy>=1.19.0",
    "codespell>=2.4.1",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["taskmaster_agent"]

[tool.codespell]
skip = "uv.lock,.venv"

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
disallow_subclassing_any = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
follow_imports = "silent"
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = ["misc", "no-untyped-call", "no-any-return"]
exclude = [".venv"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["taskmaster_agent"]

[tool.agent-starter-pack]
base_template = "adk_base"
example_question = "Process this assignment: Project 2, due in 3 days, worth 20% of the grade"
deployment_targets = ["cloud_run"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
