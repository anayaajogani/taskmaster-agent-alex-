<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskmaster — Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:      #12141C;
    --surface:  #191C28;
    --raised:   #202435;
    --line:     #2C3145;
    --paper:    #E9E7F2;
    --muted:    #767D9C;
    --high:     #FF5C7A;
    --med:      #FFB454;
    --low:      #5CD1A8;
    --accent:   #8B7FFF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 0 0 64px;
  }

  .wrap { max-width: 780px; margin: 0 auto; padding: 0 24px; }

  /* ---------- header ---------- */
  .masthead {
    padding: 56px 0 28px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 36px;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
  }
  .today {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 800;
    font-size: clamp(38px, 7vw, 62px);
    line-height: 0.94;
    letter-spacing: -0.03em;
    margin: 0 0 18px;
  }
  .load {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }
  .load b { color: var(--paper); font-weight: 500; }
  .over { color: var(--med); }

  /* ---------- tiers ---------- */
  .tier { margin-bottom: 40px; }
  .tier-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 14px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tier-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .tier-count { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); }

  /* ---------- task ---------- */
  .task {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px 18px;
    margin-bottom: 10px;
  }
  .task-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 4px;
  }
  .title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: -0.01em;
    line-height: 1.25;
  }
  .hours {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--paper);
    white-space: nowrap;
    padding-top: 2px;
  }
  .meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
  }
  .tag {
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .tag-syl { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .tag-pri { color: var(--med); border-color: color-mix(in srgb, var(--med) 40%, transparent); }
  .tag-late { color: var(--high); border-color: color-mix(in srgb, var(--high) 45%, transparent); }
  .tag-teach { color: #6FA8FF; border-color: color-mix(in srgb, #6FA8FF 45%, transparent); }

  /* ---------- runway: the signature element ---------- */
  .runway { position: relative; }
  .track {
    height: 3px;
    background: var(--raised);
    border-radius: 2px;
    position: relative;
    overflow: visible;
  }
  .elapsed {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    border-radius: 2px;
    transition: width .5s cubic-bezier(.2,.7,.3,1);
  }
  .now {
    position: absolute;
    top: -4px;
    width: 2px; height: 11px;
    background: var(--paper);
    border-radius: 1px;
    transform: translateX(-1px);
    transition: left .5s cubic-bezier(.2,.7,.3,1);
  }
  .runway-labels {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 8px;
  }

  /* ---------- later ---------- */
  .later { border-top: 1px solid var(--line); padding-top: 28px; margin-top: 44px; }
  .later-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 11px 0;
    border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
    font-size: 14px;
  }
  .later-row:last-child { border-bottom: none; }
  .later-when { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .later-course { color: var(--muted); font-size: 12px; }

  /* ---------- calendar ---------- */
  /* Colors are the SAME tiers as the task list, so the two views can't drift. */
  .cal { margin-bottom: 44px; }
  .cal-nav {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
  }
  .cal-btn {
    background: var(--raised);
    border: 1px solid var(--line);
    color: var(--paper);
    border-radius: 6px;
    padding: 4px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    cursor: pointer;
  }
  .cal-btn:hover { border-color: var(--accent); }
  .cal-range {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--muted);
    margin-left: auto;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 6px;
  }
  .cal-day {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    min-height: 118px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cal-day.today { border-color: var(--accent); }
  .cal-day.past { opacity: 0.45; }
  .cal-dow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .cal-date {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 600;
    font-size: 15px;
    line-height: 1;
    margin-bottom: 3px;
  }
  .cal-day.today .cal-date { color: var(--accent); }
  .cal-block {
    font-size: 10.5px;
    line-height: 1.3;
    padding: 3px 5px;
    border-radius: 4px;
    border-left: 3px solid;
    background: var(--raised);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cal-due {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    padding: 2px 5px;
    border-radius: 4px;
    border: 1px dashed;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cal-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
  }
  .cal-legend i {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 2px;
    margin-right: 5px;
  }
  .cal-empty {
    grid-column: 1 / -1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 22px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  @media (max-width: 700px) {
    .cal-grid { grid-template-columns: repeat(4, 1fr); }
    .cal-day { min-height: 92px; }
  }

  /* ---------- study plan ---------- */
  .plan { margin-bottom: 40px; }
  .capacity {
    height: 6px;
    border-radius: 3px;
    background: var(--raised);
    display: flex;
    overflow: hidden;
    margin: 12px 0 8px;
  }
  .cap-seg { height: 100%; }
  .cap-key {
    display: flex;
    gap: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .cap-key i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .pick {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid color-mix(in srgb, var(--line) 45%, transparent);
  }
  .pick:last-child { border-bottom: none; }
  .pick-est {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
    white-space: nowrap;
  }
  .deferred {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 14px;
  }

  /* ---------- voice ---------- */
  .voice-dock {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, var(--ink) 62%, transparent);
    padding: 26px 24px 22px;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 50;
  }
  .voice-inner {
    pointer-events: auto;
    width: 100%;
    max-width: 780px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .mic {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--raised);
    color: var(--paper);
    cursor: pointer;
    flex: none;
    display: grid;
    place-items: center;
    transition: background .2s, border-color .2s, transform .15s;
  }
  .mic:hover { border-color: var(--accent); }
  .mic:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .mic:active { transform: scale(0.94); }
  .mic.listening {
    background: var(--high);
    border-color: var(--high);
    color: var(--ink);
    animation: ring 1.4s ease-out infinite;
  }
  .mic.thinking { background: var(--accent); border-color: var(--accent); color: var(--ink); }
  @keyframes ring {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--high) 55%, transparent); }
    100% { box-shadow: 0 0 0 16px transparent; }
  }
  .voice-text {
    flex: 1;
    min-height: 22px;
    font-size: 14.5px;
    line-height: 1.5;
  }
  .voice-hint {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--muted);
  }
  .voice-you { color: var(--muted); font-size: 13px; margin-bottom: 3px; }
  .voice-unsupported { font-size: 12.5px; color: var(--muted); }
  body { padding-bottom: 120px; }

  /* ---------- materials ---------- */
  .mats { border-top: 1px solid var(--line); padding-top: 28px; margin-top: 44px; }
  .mat-course {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 22px 0 10px;
  }
  .mat-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid color-mix(in srgb, var(--line) 45%, transparent);
  }
  .mat-row:last-child { border-bottom: none; }
  .mat-kind {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    min-width: 78px;
    flex: none;
  }
  .mat-title { font-size: 14px; }
  .mat-title a { color: var(--paper); text-decoration: none; border-bottom: 1px solid transparent; }
  .mat-title a:hover, .mat-title a:focus { border-bottom-color: var(--accent); }

  /* ---------- empty / error ---------- */
  .empty {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 32px 24px;
    text-align: center;
  }
  .empty h3 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 20px; font-weight: 600; margin: 0 0 8px;
  }
  .empty p { color: var(--muted); font-size: 14px; margin: 0; line-height: 1.55; }
  code {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    background: var(--raised);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--paper);
  }
  .foot {
    margin-top: 40px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--low);
    flex: none;
    animation: breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.25; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TIERS = [
  { key: "HIGH",   label: "High priority",   color: "var(--high)" },
  { key: "MEDIUM", label: "Medium priority", color: "var(--med)"  },
  { key: "LOW",    label: "Low priority",    color: "var(--low)"  },
];

function longDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, {
    weekday: "long", month: "long", day: "numeric",
  });
}

function shortDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, {
    month: "short", day: "numeric",
  });
}

function dueText(days) {
  if (days < 0) return "overdue";
  if (days === 0) return "due today";
  if (days === 1) return "due tomorrow";
  return `${days} days left`;
}

// The runway: how far between "you could start" and "it's due" are we?
function Runway({ task, today, color }) {
  const start = new Date(task.start_date + "T00:00:00");
  const due   = new Date(task.due_date + "T00:00:00");
  const now   = new Date(today + "T00:00:00");

  const span = Math.max(due - start, 1);
  const pct  = Math.min(Math.max((now - start) / span, 0), 1) * 100;

  return (
    <div className="runway">
      <div className="track">
        <div className="elapsed" style={{ width: pct + "%", background: color, opacity: 0.55 }} />
        <div className="now" style={{ left: pct + "%" }} />
      </div>
      <div className="runway-labels">
        <span>start {shortDate(task.start_date)}</span>
        <span>due {shortDate(task.due_date)}</span>
      </div>
    </div>
  );
}

function Task({ task, today, color }) {
  return (
    <div className="task">
      <div className="task-top">
        <div className="title">{task.title}</div>
        <div className="hours">{task.hours}h</div>
      </div>
      <div className="meta">
        <span>{task.course}</span>
        <span>·</span>
        <span>{dueText(task.days_left)}</span>
        {task.priority_course && <span className="tag tag-pri">priority course</span>}
        {task.work_type === "teaching" && <span className="tag tag-teach">teaching</span>}
        {task.from_syllabus && <span className="tag tag-syl">from syllabus</span>}
        {task.overdue_start && <span className="tag tag-late">start date passed</span>}
      </div>
      <Runway task={task} today={today} color={color} />
    </div>
  );
}

// One colour scale, shared by the calendar and the task list, so the two
// views always agree about what "urgent" looks like.
const TIER_COLOR = {
  critical: "var(--high)",
  soon:     "var(--med)",
  upcoming: "#E8D44D",
  later:    "var(--low)",
  priority: "var(--accent)",
  teaching: "#6FA8FF",
};

// Google Calendar colorIds -> our tiers (taskmaster_calendar.py writes these).
const COLOR_ID_TIER = {
  "11": "critical", "6": "soon", "5": "upcoming", "10": "later", "3": "priority", "9": "teaching",
};

function tierForDate(due) {
  const days = (due - new Date()) / 86400000;
  if (days <= 2) return "critical";
  if (days <= 5) return "soon";
  if (days <= 14) return "upcoming";
  return "later";
}

function Calendar({ data }) {
  const [offset, setOffset] = useState(0);   // weeks from this one
  if (!data) return null;

  const events = data.events || [];
  const deadlines = data.deadlines || [];

  // Build the 7 days of the shown week, starting Sunday.
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() - today.getDay() + offset * 7);

  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);
    return d;
  });

  const sameDay = (a, b) =>
    a.getFullYear() === b.getFullYear() &&
    a.getMonth() === b.getMonth() &&
    a.getDate() === b.getDate();

  // Deadlines carry a formatted label ("Thu Sep 24 07:00 PM"); parse to a date.
  const parseDue = (label) => {
    const d = new Date(label + " " + weekStart.getFullYear());
    return isNaN(d) ? null : d;
  };

  const rangeLabel =
    days[0].toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
    " – " +
    days[6].toLocaleDateString(undefined, { month: "short", day: "numeric" });

  const anythingThisWeek = days.some(d =>
    events.some(e => sameDay(new Date(e.start), d)) ||
    deadlines.some(dl => { const p = parseDue(dl.due_label); return p && sameDay(p, d); })
  );

  return (
    <section className="cal">
      <div className="tier-head">
        <span className="dot" style={{ background: "var(--accent)" }} />
        <span className="tier-name" style={{ color: "var(--accent)" }}>Calendar</span>
        <span className="tier-count">{events.length} blocks</span>
      </div>

      <div className="cal-nav">
        <button className="cal-btn" onClick={() => setOffset(offset - 1)}>← prev</button>
        <button className="cal-btn" onClick={() => setOffset(0)}>this week</button>
        <button className="cal-btn" onClick={() => setOffset(offset + 1)}>next →</button>
        <span className="cal-range">{rangeLabel}</span>
      </div>

      <div className="cal-grid">
        {!anythingThisWeek && offset === 0 && (
          <div className="cal-empty">
            {data.has_calendar_access
              ? "Nothing scheduled this week."
              : "No calendar blocks yet — run the scheduler to fill this in."}
          </div>
        )}
        {(anythingThisWeek || offset !== 0) && days.map((d, i) => {
          const isToday = sameDay(d, today);
          const isPast = d < today && !isToday;
          const dayEvents = events.filter(e => sameDay(new Date(e.start), d));
          const dayDue = deadlines.filter(dl => {
            const p = parseDue(dl.due_label);
            return p && sameDay(p, d);
          });
          return (
            <div className={"cal-day" + (isToday ? " today" : "") + (isPast ? " past" : "")} key={i}>
              <div className="cal-dow">
                {d.toLocaleDateString(undefined, { weekday: "short" })}
              </div>
              <div className="cal-date">{d.getDate()}</div>

              {dayDue.map((dl, j) => {
                const tier = dl.priority_course ? "priority" : tierForDate(parseDue(dl.due_label));
                return (
                  <div className="cal-due" key={"d" + j}
                       style={{ color: TIER_COLOR[tier], borderColor: TIER_COLOR[tier] }}
                       title={dl.title + " due — " + (dl.course || "")}>
                    DUE {dl.title}
                  </div>
                );
              })}

              {dayEvents.map((e, j) => {
                const tier = COLOR_ID_TIER[e.color_id] || "upcoming";
                const start = new Date(e.start);
                const label = start.toLocaleTimeString(undefined,
                  { hour: "numeric", minute: "2-digit" });
                return (
                  <div className="cal-block" key={"e" + j}
                       style={{ borderLeftColor: TIER_COLOR[tier] }}
                       title={e.title + "\n" + e.description}>
                    {label} {e.title.replace(/^Work:\s*/, "").replace(/\s*\([^)]*\)\s*$/, "")}
                  </div>
                );
              })}
            </div>
          );
        })}
      </div>

      <div className="cal-legend">
        <span><i style={{ background: TIER_COLOR.critical }} />due &lt;2 days</span>
        <span><i style={{ background: TIER_COLOR.soon }} />&lt;5 days</span>
        <span><i style={{ background: TIER_COLOR.upcoming }} />&lt;2 weeks</span>
        <span><i style={{ background: TIER_COLOR.later }} />later</span>
        <span><i style={{ background: TIER_COLOR.priority }} />priority course</span>
        <span><i style={{ background: TIER_COLOR.teaching }} />teaching work</span>
        <span>solid = work block · dashed = deadline</span>
      </div>
    </section>
  );
}

// Voice: browser handles speech, the agent handles understanding.
function Voice() {
  const [state, setState] = useState("idle");   // idle | listening | thinking
  const [heard, setHeard]   = useState("");
  const [reply, setReply]   = useState("");
  const recogRef = React.useRef(null);

  // Browsers load the voice list asynchronously — without this, the first
  // reply speaks in the default voice because the list is still empty.
  useEffect(() => {
    const warm = () => window.speechSynthesis.getVoices();
    warm();
    window.speechSynthesis.onvoiceschanged = warm;
    return () => { window.speechSynthesis.onvoiceschanged = null; };
  }, []);

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const supported = !!SR;

  // Browser speech uses whatever voices are installed locally, so we can't
  // guarantee an identical voice everywhere. This picks the best available on
  // each platform in preference order, so nobody gets stuck with the tinny
  // default. Enhanced/Premium variants are downloaded system voices and sound
  // dramatically better than the compact ones.
  const VOICE_PREFERENCES = [
    // macOS, best first
    "Ava (Premium)", "Ava (Enhanced)", "Samantha (Enhanced)", "Zoe (Premium)",
    "Allison (Enhanced)", "Ava", "Samantha", "Allison", "Susan",
    // Windows
    "Microsoft Aria Online (Natural) - English (United States)",
    "Microsoft Jenny Online (Natural) - English (United States)",
    "Microsoft Aria", "Microsoft Zira",
    // Chrome's own / Android
    "Google US English", "Google UK English Female",
  ];

  const pickVoice = () => {
    const voices = window.speechSynthesis.getVoices() || [];
    if (!voices.length) return null;

    for (const wanted of VOICE_PREFERENCES) {
      const hit = voices.find(v => v.name === wanted);
      if (hit) return hit;
    }
    // Nothing from the list — prefer any English voice that isn't a
    // "compact" (low quality) variant.
    const english = voices.filter(v => v.lang && v.lang.startsWith("en"));
    return english.find(v => !/compact/i.test(v.voiceURI || "")) || english[0] || null;
  };

  const speak = (text) => {
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice();
      if (v) u.voice = v;
      u.rate = 1.0;
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
    } catch (e) { /* speech synthesis unavailable; text still shows */ }
  };

  const send = (question) => {
    setState("thinking");
    fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    })
      .then(r => r.json())
      .then(d => {
        setReply(d.answer || "");
        setState("idle");
        speak(d.answer || "");
      })
      .catch(() => {
        setReply("I couldn't reach the agent.");
        setState("idle");
      });
  };

  const listen = () => {
    if (state === "listening") { recogRef.current && recogRef.current.stop(); return; }
    if (!supported) return;
    window.speechSynthesis.cancel();

    const r = new SR();
    recogRef.current = r;
    r.lang = "en-US";
    r.interimResults = true;
    r.continuous = false;

    let finalText = "";
    r.onstart = () => { setState("listening"); setHeard(""); setReply(""); };
    r.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t; else interim += t;
      }
      setHeard(finalText || interim);
    };
    r.onerror = () => { setState("idle"); setReply("I didn't catch that."); };
    r.onend = () => {
      const q = finalText.trim();
      if (q) send(q); else setState("idle");
    };
    r.start();
  };

  const label =
    state === "listening" ? "Listening — tap to stop"
    : state === "thinking" ? "Thinking"
    : "Tap and ask about your work";

  return (
    <div className="voice-dock">
      <div className="voice-inner">
        <button
          className={"mic " + state}
          onClick={listen}
          disabled={!supported || state === "thinking"}
          aria-label={state === "listening" ? "Stop listening" : "Ask a question"}
        >
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" strokeWidth="2" strokeLinecap="round">
            <rect x="9" y="2" width="6" height="11" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0" />
            <path d="M12 18v4" />
          </svg>
        </button>
        <div className="voice-text">
          {!supported ? (
            <span className="voice-unsupported">
              Voice needs Chrome or Edge. Everything else works here.
            </span>
          ) : reply ? (
            <>
              {heard && <div className="voice-you">"{heard}"</div>}
              <div>{reply}</div>
            </>
          ) : heard ? (
            <div>{heard}</div>
          ) : (
            <span className="voice-hint">{label}</span>
          )}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [err, setErr]   = useState(null);
  const [lastSync, setLastSync] = useState(null);

  // Poll the JSON so the page reflects the agent's latest run without a
  // manual reload. Cheap: it's a local file, and only re-renders on change.
  useEffect(() => {
    let stop = false;
    let prev = null;

    const load = () => {
      fetch("daily_view.json?t=" + Date.now())
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(d => {
          if (stop) return;
          const stamp = JSON.stringify(d);
          if (stamp !== prev) { prev = stamp; setData(d); }
          setLastSync(new Date());
          setErr(null);
        })
        .catch(e => { if (!stop) setErr(String(e)); });
    };

    load();
    const id = setInterval(load, 30000);          // every 30s
    const onFocus = () => load();                  // and when you come back
    window.addEventListener("focus", onFocus);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) load();
    });

    return () => {
      stop = true;
      clearInterval(id);
      window.removeEventListener("focus", onFocus);
    };
  }, []);

  if (err) return (
    <div className="wrap">
      <div className="masthead">
        <p className="eyebrow">Taskmaster</p>
        <h1 className="today">No data yet</h1>
      </div>
      <div className="empty">
        <h3>Run the agent first</h3>
        <p>
          This page reads <code>daily_view.json</code>. Generate it with{" "}
          <code>uv run python -m expense_agent.daily_view</code>, then serve this
          folder with <code>python3 -m http.server 8000</code>.
        </p>
      </div>
    </div>
  );

  if (!data) return <div className="wrap"><div className="masthead"><p className="eyebrow">Taskmaster</p><h1 className="today">Loading</h1></div></div>;

  const active = data.active || [];
  const later  = data.upcoming || [];
  const load   = active.reduce((s, t) => s + (t.hours || 0), 0);
  const cap    = data.daily_cap_hours;

  return (
    <div className="wrap">
      <header className="masthead">
        <p className="eyebrow">Taskmaster · what's open right now</p>
        <h1 className="today">{longDate(data.date)}</h1>
        <p className="load">
          {active.length === 0
            ? "Nothing open yet"
            : <>
                <b>{active.length}</b> {active.length === 1 ? "task" : "tasks"} open
                {" · "}<b>{Math.round(load * 10) / 10}h</b> of work
                {" · "}cap <b>{cap}h</b>/day
                {load > cap && <span className="over"> · spread across several days</span>}
              </>}
        </p>
      </header>

      <Calendar data={data.calendar} />

      {active.length === 0 && (
        <div className="empty">
          <h3>Nothing to start today</h3>
          <p>
            {(data.materials || []).length > 0
              ? "No deadlines are close enough to start on. Course materials below are open if you want to get ahead."
              : "Everything on your plate is still far enough out that starting now wouldn't help. The list below shows when each one opens."}
          </p>
        </div>
      )}

      {TIERS.map(tier => {
        const rows = active.filter(t => t.tier === tier.key);
        if (!rows.length) return null;
        return (
          <section className="tier" key={tier.key}>
            <div className="tier-head">
              <span className="dot" style={{ background: tier.color }} />
              <span className="tier-name" style={{ color: tier.color }}>{tier.label}</span>
              <span className="tier-count">{rows.length}</span>
            </div>
            {rows.map((t, i) => (
              <Task key={t.title + i} task={t} today={data.date} color={tier.color} />
            ))}
          </section>
        );
      })}

      {later.length > 0 && (
        <section className="later">
          <div className="tier-head">
            <span className="tier-name" style={{ color: "var(--muted)" }}>Opens later</span>
            <span className="tier-count">{later.length}</span>
          </div>
          {later.map((t, i) => (
            <div className="later-row" key={t.title + i}>
              <div>
                <div>
                  {t.title}
                  {t.work_type === "teaching" &&
                    <span className="tag tag-teach" style={{ marginLeft: 8 }}>teaching</span>}
                </div>
                <div className="later-course">{t.course}</div>
              </div>
              <div className="later-when">
                {t.opens_in_days === 1 ? "starts tomorrow" : `starts in ${t.opens_in_days} days`}
              </div>
            </div>
          ))}
        </section>
      )}

      {data.study_plan && (data.study_plan.picks || []).length > 0 && (() => {
        const p = data.study_plan;
        const total = p.cap_hours * 60;
        const dl = Math.min(p.deadline_minutes, total);
        const st = Math.min(p.planned_minutes, Math.max(total - dl, 0));
        const free = Math.max(total - dl - st, 0);
        return (
          <section className="plan">
            <div className="tier-head">
              <span className="dot" style={{ background: "var(--accent)" }} />
              <span className="tier-name" style={{ color: "var(--accent)" }}>Study today</span>
              <span className="tier-count">{p.picks.length}</span>
            </div>

            <div className="capacity">
              {dl > 0 && <div className="cap-seg" style={{ width: (dl/total*100)+"%", background: "var(--high)" }} />}
              {st > 0 && <div className="cap-seg" style={{ width: (st/total*100)+"%", background: "var(--accent)" }} />}
              {free > 0 && <div className="cap-seg" style={{ width: (free/total*100)+"%", background: "var(--raised)" }} />}
            </div>
            <div className="cap-key">
              {dl > 0 && <span><i style={{background:"var(--high)"}} />deadline work {Math.round(dl)}m</span>}
              <span><i style={{background:"var(--accent)"}} />study {Math.round(st)}m</span>
              {free > 0 && <span><i style={{background:"var(--raised)"}} />free {Math.round(free)}m</span>}
            </div>

            {p.picks.map((m, i) => (
              <div className="pick" key={m.title + i}>
                <span className="mat-kind">{m.label}</span>
                <span className="mat-title">
                  {m.url ? <a href={m.url} target="_blank" rel="noreferrer">{m.title}</a> : m.title}
                </span>
                <span className="pick-est">~{m.est_minutes}m</span>
              </div>
            ))}
            {p.not_today > 0 && (
              <p className="deferred">{p.not_today} more saved for another day</p>
            )}
          </section>
        );
      })()}

      {(data.materials || []).length > 0 && (() => {
        const picked = new Set(((data.study_plan || {}).picks || []).map(x => x.title));
        const rest = data.materials.filter(m => !picked.has(m.title));
        if (!rest.length) return null;
        return (
        <section className="mats">
          <div className="tier-head">
            <span className="tier-name" style={{ color: "var(--muted)" }}>Also open</span>
            <span className="tier-count">{rest.length}</span>
          </div>
          {Object.entries(
            rest.reduce((acc, m) => {
              (acc[m.course] = acc[m.course] || []).push(m);
              return acc;
            }, {})
          ).map(([course, rows]) => (
            <div key={course}>
              <div className="mat-course">{course}</div>
              {rows.map((m, i) => (
                <div className="mat-row" key={m.title + i}>
                  <span className="mat-kind">{m.label}</span>
                  <span className="mat-title">
                    {m.url
                      ? <a href={m.url} target="_blank" rel="noreferrer">{m.title}</a>
                      : m.title}
                  </span>
                </div>
              ))}
            </div>
          ))}
        </section>
        );
      })()}

      <Voice />

      <p className="foot">
        <span className="pulse" /> Live · agent last ran{" "}
        {new Date(data.generated_at).toLocaleString(undefined, {
          month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
        })}
        {lastSync && <> · checked {lastSync.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}</>}
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
